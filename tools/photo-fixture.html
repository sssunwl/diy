<!doctype html><html lang="zh-HK"><meta charset="utf-8"><title>本機測試照片</title><p>按下按鈕，離線產生真正的 800×800 WebP 供 smoke 測試。只作本機測試。</p><button>下載測試照片</button><script>document.querySelector('button').onclick=()=>{const c=document.createElement('canvas');c.width=c.height=800;const x=c.getContext('2d');x.fillStyle='#e8c79a';x.fillRect(0,0,800,800);x.fillStyle='#78bda5';x.fillRect(250,200,300,350);c.toBlob(b=>{const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='smoke-800.webp';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);},'image/webp',.82);};</script></html>
