<!doctype html><html lang="zh-HK"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>趁墟・站長後台</title><style>body{font:16px -apple-system,"PingFang HK",sans-serif;background:#f6ecdc;color:#443c33;max-width:1100px;margin:24px auto;padding:16px}button,a{min-height:44px;display:inline-flex;align-items:center;margin:4px;padding:0 14px}button{background:#ffe2a7;border:1px solid #88755c;cursor:pointer}article{border:1px solid #bda58b;padding:18px;margin:20px 0;background:#fffaf0}.versions{display:flex;gap:20px}.versions section{flex:1;min-width:0}img{width:100px;height:100px;object-fit:cover;cursor:zoom-in}pre{white-space:pre-wrap;overflow-wrap:anywhere}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #cdb99f;text-align:left;overflow-wrap:anywhere}dialog img{width:min(75vw,800px);height:auto}dialog{max-width:90vw}#message{color:#ac382d}@media(max-width:600px){.versions{display:block}}</style><h1>趁墟・站長後台</h1><nav><button data-status="pending">待審</button><button data-status="live">已上架</button><button data-status="rejected">被退回</button></nav><p id="occupancy"></p><p id="message" role="status"></p><main></main><h2>登入紀錄</h2><p>香港時間；保留 365 天，最近 200 筆。</p><table><thead><tr><th>時間</th><th>Email</th><th>路徑</th><th>國家</th></tr></thead><tbody id="visits"></tbody></table><dialog><button id="close">關閉</button><br><img alt="作品大圖"></dialog><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let status='pending';
async function api(path,body){const r=await fetch('/api/admin/'+path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error);return d;}
function version(d,title){if(!d)return '<section><h3>'+title+'</h3><p>沒有版本</p></section>';return '<section><h3>'+title+'</h3><h4>'+esc(d.name)+'</h4>'+d.photos.map(p=>'<img src="'+esc(p)+'" alt="作品">').join('')+'<p><a target="_blank" rel="noopener noreferrer" href="'+esc(d.igUrl)+'">查看 IG</a></p><pre>'+esc(JSON.stringify(d,null,2))+'</pre></section>';}
async function load(){try{const d=await api('list?status='+status);$('#occupancy').textContent=d.occupancy.map(x=>(x.street==='ki-lung'?'基隆街':'汝州街')+' '+x.count+'/12').join('　');$('main').innerHTML=d.stalls.length?d.stalls.map(s=>'<article data-id="'+s.id+'"><p>'+esc(s.email)+' '+esc(s.rejectReason||'')+'</p>'+(s.live&&s.draft?'<p>更改欄位：'+esc(Object.keys(s.draft).filter(k=>JSON.stringify(s.draft[k])!==JSON.stringify(s.live[k])).join('、'))+'</p>':'')+'<div class="versions">'+version(s.live,'公開舊版')+version(s.draft,'送審版本')+'</div>'+(s.draft?'<button data-action="approve">核准</button><button data-action="reject">退回</button>':'')+(s.live?'<button data-action="takedown">下架</button>':'')+'</article>').join(''):'<p>這一欄暫時沒有攤位。</p>';}catch(e){$('#message').textContent=e.message;}}
document.onclick=async e=>{const b=e.target;if(b.dataset.status){status=b.dataset.status;load();}if(b.tagName==='IMG'&&!b.closest('dialog')){$('dialog img').src=b.src;$('dialog').showModal();}if(b.dataset.action){const action=b.dataset.action,id=b.closest('article').dataset.id;let reason;if(action!=='approve'){reason=prompt('請填寫原因');if(!reason)return;}else if(!confirm('核准這個版本？'))return;try{await api(action,{id,reason});$('#message').textContent='已更新';load();}catch(e){$('#message').textContent=e.message;}}};$('#close').onclick=()=>$('dialog').close();
load();api('visits').then(d=>{$('#visits').innerHTML=d.visits.map(v=>'<tr><td>'+esc(new Date(v.at).toLocaleString('zh-HK',{timeZone:'Asia/Hong_Kong',hour12:false}))+'</td><td>'+esc(v.email)+'</td><td>'+esc(v.path)+'</td><td>'+esc(v.country)+'</td></tr>').join('');}).catch(e=>$('#message').textContent=e.message);
</script></html>
